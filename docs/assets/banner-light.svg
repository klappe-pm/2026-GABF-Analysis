<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">GABF Analysis</title>
  <desc id="desc">Wordmark for GABF Analysis, Great American Beer Festival results from 2018 to 2026, with gold, silver, and bronze medals arranged as a podium.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e48c"/>
      <stop offset="0.45" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9a7514"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.45" stop-color="#c0c2c5"/>
      <stop offset="1" stop-color="#7f8389"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeb27a"/>
      <stop offset="0.45" stop-color="#cd7f32"/>
      <stop offset="1" stop-color="#874f1c"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="#f9f9f7" stroke="#0b0b0b" stroke-opacity="0.1"/>
  <g stroke-width="2" transform="translate(36 0)">
    <line x1="96" y1="252" x2="384" y2="252" stroke="#c3c2b7" stroke-width="2"/>
    <g>
      <rect x="132" y="212" width="56" height="40" fill="#e1e0d9"/>
      <circle cx="160" cy="164" r="42" fill="url(#silver)" stroke="#6b6f75"/>
      <circle cx="160" cy="164" r="31" fill="none" stroke="#ffffff" stroke-opacity="0.65"/>
    </g>
    <g>
      <rect x="212" y="192" width="56" height="60" fill="#e1e0d9"/>
      <circle cx="240" cy="140" r="46" fill="url(#gold)" stroke="#86650f"/>
      <circle cx="240" cy="140" r="34" fill="none" stroke="#fff6cc" stroke-opacity="0.7"/>
    </g>
    <g>
      <rect x="292" y="226" width="56" height="26" fill="#e1e0d9"/>
      <circle cx="320" cy="182" r="38" fill="url(#bronze)" stroke="#774216"/>
      <circle cx="320" cy="182" r="28" fill="none" stroke="#ffe3c7" stroke-opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(36 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#0b0b0b">
    <text x="448" y="168" font-size="92" letter-spacing="-2"><tspan font-weight="800">GABF</tspan><tspan font-weight="400" dx="22">Analysis</tspan></text>
    <text x="452" y="226" font-size="30" fill="#52514e">Great American Beer Festival results, 2018 to 2026</text>
    <rect x="452" y="250" width="40" height="4" rx="2" fill="#d4af37"/>
    <rect x="500" y="250" width="40" height="4" rx="2" fill="#a7aaae"/>
    <rect x="548" y="250" width="40" height="4" rx="2" fill="#cd7f32"/>
  </g>
</svg>
