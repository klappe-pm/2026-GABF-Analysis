<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">GABF Analysis</title>
  <desc id="desc">Wordmark for GABF Analysis: Great American Beer Festival Results, 2018 to 2026, with gold, silver, and bronze medals on a podium.</desc>
  <rect x="1" y="1" width="638" height="638" fill="#f9f9f7" stroke="#dcdbd4" stroke-width="2"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <line x1="200" y1="270" x2="440" y2="270" stroke="#c9c8bf" stroke-width="1.5"/>
    <rect x="216" y="226" width="64" height="44" fill="#e6e5df"/>
    <rect x="288" y="206" width="64" height="64" fill="#e6e5df"/>
    <rect x="360" y="242" width="64" height="28" fill="#e6e5df"/>
    <g text-anchor="middle" font-size="15" font-weight="500" fill="#8a897f">
      <text x="248" y="254">2</text>
      <text x="320" y="244">1</text>
      <text x="392" y="262">3</text>
    </g>
    <circle cx="248" cy="190" r="28" fill="#aeb2b7" stroke="#80858b" stroke-width="1.5"/>
    <circle cx="248" cy="190" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="320" cy="170" r="28" fill="#c9a227" stroke="#93761a" stroke-width="1.5"/>
    <circle cx="320" cy="170" r="20" fill="none" stroke="#fff4c4" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="392" cy="206" r="28" fill="#a86a35" stroke="#7a4b24" stroke-width="1.5"/>
    <circle cx="392" cy="206" r="20" fill="none" stroke="#ffdcbc" stroke-opacity="0.55" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="320" y="370" font-size="64" letter-spacing="-1" fill="#111110"><tspan font-weight="600">GABF</tspan><tspan font-weight="300" dx="14">Analysis</tspan></text>
      <text x="320" y="414" font-size="21" letter-spacing="0.4" fill="#55544f">Great American Beer Festival Results</text>
      <rect x="268" y="440" width="32" height="3" fill="#c9a227"/>
      <rect x="304" y="440" width="32" height="3" fill="#aeb2b7"/>
      <rect x="340" y="440" width="32" height="3" fill="#a86a35"/>
      <text x="320" y="482" font-size="19" letter-spacing="1.5" fill="#55544f">2018 to 2026</text>
    </g>
