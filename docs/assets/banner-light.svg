<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">GABF Analysis</title>
  <desc id="desc">Wordmark for GABF Analysis: Great American Beer Festival Results, 2018 to 2026, with gold, silver, and bronze medals on a podium.</desc>
  <rect x="1" y="1" width="638" height="638" fill="#ffffff" stroke="#c6c6c6" stroke-width="2"/>
  <g font-family="'Public Sans', sans-serif">
    <line x1="200" y1="270" x2="440" y2="270" stroke="#c6c6c6" stroke-width="1.5"/>
    <rect x="216" y="226" width="64" height="44" fill="#e8e8e8"/>
    <rect x="288" y="206" width="64" height="64" fill="#e8e8e8"/>
    <rect x="360" y="242" width="64" height="28" fill="#e8e8e8"/>
    <g text-anchor="middle" font-size="15" font-weight="500" fill="#474747">
      <text x="248" y="254">2</text>
      <text x="320" y="244">1</text>
      <text x="392" y="262">3</text>
    </g>
    <circle cx="248" cy="190" r="28" fill="#8a9199" stroke="#61666b" stroke-width="1.5"/>
    <circle cx="248" cy="190" r="20" fill="none" stroke="#dcdee0" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="320" cy="170" r="28" fill="#b8860b" stroke="#815e08" stroke-width="1.5"/>
    <circle cx="320" cy="170" r="20" fill="none" stroke="#eadbb6" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="392" cy="206" r="28" fill="#bf7b4a" stroke="#865634" stroke-width="1.5"/>
    <circle cx="392" cy="206" r="20" fill="none" stroke="#ecd7c9" stroke-opacity="0.6" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="320" y="370" font-size="64" letter-spacing="-1" fill="#1b1b1b"><tspan font-weight="700">GABF</tspan><tspan font-weight="300" dx="14" fill="#2d6a4f">Analysis</tspan></text>
      <text x="320" y="414" font-family="'Archivo Narrow', 'Public Sans', sans-serif" font-size="23" letter-spacing="0.4" fill="#474747">Great American Beer Festival Results</text>
      <rect x="268" y="440" width="32" height="3" fill="#b8860b"/>
      <rect x="304" y="440" width="32" height="3" fill="#8a9199"/>
      <rect x="340" y="440" width="32" height="3" fill="#bf7b4a"/>
      <text x="320" y="482" font-size="19" letter-spacing="1.5" fill="#474747">2018 to 2026</text>
    </g>
  </g>
