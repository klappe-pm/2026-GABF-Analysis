<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">GABF Analysis</title>
  <desc id="desc">Wordmark for GABF Analysis: Great American Beer Festival Results, 2018 to 2026, with gold, silver, and bronze medals arranged as a podium.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e48c"/>
      <stop offset="0.45" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9a7514"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.45" stop-color="#c0c2c5"/>
      <stop offset="1" stop-color="#7f8389"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeb27a"/>
      <stop offset="0.45" stop-color="#cd7f32"/>
      <stop offset="1" stop-color="#874f1c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="638" rx="28" fill="#0d0d0d" stroke="#3a3a37" stroke-width="2"/>
  <g stroke-width="2">
    <line x1="176" y1="238" x2="464" y2="238" stroke="#383835"/>
    <rect x="212" y="198" width="56" height="40" fill="#1f1f1e"/>
    <circle cx="240" cy="150" r="42" fill="url(#silver)" stroke="#2c2c2a"/>
    <circle cx="240" cy="150" r="31" fill="none" stroke="#ffffff" stroke-opacity="0.65"/>
    <rect x="292" y="178" width="56" height="60" fill="#1f1f1e"/>
    <circle cx="320" cy="126" r="46" fill="url(#gold)" stroke="#2c2c2a"/>
    <circle cx="320" cy="126" r="34" fill="none" stroke="#fff6cc" stroke-opacity="0.7"/>
    <rect x="372" y="212" width="56" height="26" fill="#1f1f1e"/>
    <circle cx="400" cy="168" r="38" fill="url(#bronze)" stroke="#2c2c2a"/>
    <circle cx="400" cy="168" r="28" fill="none" stroke="#ffe3c7" stroke-opacity="0.6"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#f0efec">
    <text x="320" y="358" font-size="120" font-weight="800" letter-spacing="-3">GABF</text>
    <text x="320" y="434" font-size="72" font-weight="400" letter-spacing="-1">Analysis</text>
    <text x="320" y="496" font-size="26" fill="#c3c2b7">Great American Beer Festival Results</text>
    <rect x="252" y="522" width="40" height="4" rx="2" fill="#d4af37"/>
    <rect x="300" y="522" width="40" height="4" rx="2" fill="#c0c2c5"/>
    <rect x="348" y="522" width="40" height="4" rx="2" fill="#cd7f32"/>
    <text x="320" y="572" font-size="24" fill="#c3c2b7">2018 to 2026</text>
  </g>
</svg>
