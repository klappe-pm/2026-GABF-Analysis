name: ingest-results

# Fetch the official GABF winners list for a year, parse it, enrich breweries, and
# commit the data. Runs on demand, and on a schedule every two hours from October 11
# to October 20 (the window in which the Brewers Association publishes the list).
# The data always arrives as a pull request, because branch protection on main requires the
# build check and rejects a direct push. A pull request opened with the workflow token does not
# trigger workflows, so this workflow dispatches ci.yml on the new branch, which puts the build
# check on its head commit. With publish true (and on the schedule) it waits for that check and
# merges the pull request; the merge is a push to main, which AWS CodeBuild builds and deploys
# (buildspec.yml) whoever made it. With publish false it leaves the pull request for review.

on:
  workflow_dispatch:
    inputs:
      year:
        description: Competition year
        required: true
        default: "2026"
      pdf_url:
        description: Direct URL to the official winners list PDF (optional)
        required: false
        default: ""
      publish:
        description: Merge the pull request once ci passes and deploy (true), or leave it for review (false)
        required: false
        default: "true"
  schedule:
    - cron: "17 */2 11-20 10 *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: resolve-year
        id: year
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR="$(date -u +%Y)"; fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
      - name: skip-if-already-loaded
        id: loaded
        run: |
          FILE="data/results/gabf-${{ steps.year.outputs.year }}.csv"
          if [ -f "$FILE" ] && ! grep -qi "partial seed" "$FILE" && [ "$(wc -l < "$FILE")" -gt 100 ]; then
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "loaded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: fetch
        id: fetch
        if: steps.loaded.outputs.loaded == 'false'
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            node scripts/fetch-winners.mjs --year "${{ steps.year.outputs.year }}" --url "${{ github.event.inputs.pdf_url }}" --force
          else
            node scripts/fetch-winners.mjs --year "${{ steps.year.outputs.year }}" --force
          fi
      - name: no-list-yet
        if: steps.loaded.outputs.loaded == 'false' && steps.fetch.outcome != 'success'
        run: echo "No official winners list found for ${{ steps.year.outputs.year }} yet. Nothing to do."
      - name: parse-enrich-build
        if: steps.fetch.outcome == 'success'
        run: |
          node scripts/parse-winners.mjs --year "${{ steps.year.outputs.year }}"
          node scripts/enrich-breweries.mjs
          npm test
          npm run validate
          npm run build
          npm run build:standalone
      - name: commit
        if: steps.fetch.outcome == 'success'
        id: commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          # gabf-dashboard.html and the other single file pages are build outputs, not in git.
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: ingest GABF ${{ steps.year.outputs.year }} winners list"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: open-pull-request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/gabf-${{ steps.year.outputs.year }}-$(date -u +%Y%m%d%H%M)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --title "data: ingest GABF ${{ steps.year.outputs.year }} winners list" --body "Automated ingest of the official GABF ${{ steps.year.outputs.year }} winners list. Review data/results/gabf-${{ steps.year.outputs.year }}.csv for parse problems before merging." --base main --head "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: merge-and-deploy
        if: steps.commit.outputs.changed == 'true' && (github.event.inputs.publish == 'true' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then echo "the ci run for $BRANCH did not start; merge the pull request by hand once build passes"; exit 1; fi
          gh run watch "$RUN_ID" --exit-status
          gh pr merge "$BRANCH" --merge --delete-branch
