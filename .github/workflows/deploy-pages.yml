name: deploy-pages

# Run the same gates as npm run verify, then publish dist/ to GitHub Pages.
# Pull requests run the gates only; pushes to main and manual runs also deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm run design-system:check
      - run: npm run build
      - name: standalone-dashboard-is-current
        run: |
          npm run build:standalone
          git diff --exit-code --stat gabf-dashboard.html || { echo "gabf-dashboard.html is stale: run npm run build:standalone and commit it"; exit 1; }
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
