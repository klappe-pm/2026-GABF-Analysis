name: Bug report
description: Something on the site, in the single file dashboard, or in a script does not work as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. For a wrong medal, brewery, or figure, use the Data correction form instead."
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Live site (klappe-pm.github.io/GABF-Analysis)
        - Single file dashboard (gabf-dashboard.html)
        - A script or npm command
        - A workflow (GitHub Actions)
        - Somewhere else
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL or command
      description: The page address (filters are in the URL) or the exact command you ran, with its working directory.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what you saw instead, and any error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the Geography dashboard\n2. Pick a state\n3. ..."
  - type: input
    id: environment
    attributes:
      label: Browser or Node version
      placeholder: "Safari 19, or Node 22.11"
